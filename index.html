<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TunnelWarp</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%2346f0ff' stroke-width='4'/%3E%3Ccircle cx='16' cy='28' r='3' fill='%23ff3ea5'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="src/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.185.1/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <div id="ui" class="ui">
      <header class="hud">
        <div class="hud-block">
          <span class="hud-label">Rings</span>
          <span class="hud-value" id="hud-rings">0</span>
          <span class="hud-tier" id="hud-tier" hidden></span>
        </div>
        <div class="hud-block hud-block--center">
          <span class="hud-label">Score</span>
          <span class="hud-value hud-value--score" id="hud-score">0</span>
          <div class="hud-warp" id="hud-warp" data-state="charging">
            <span class="hud-warp-track">
              <span class="hud-warp-fill" id="hud-warp-fill"></span>
            </span>
            <span class="hud-warp-label" id="hud-warp-label">Warp energy</span>
          </div>
        </div>
        <div class="hud-block hud-block--right">
          <span class="hud-label">Best rings</span>
          <span class="hud-value" id="hud-best">0</span>
        </div>
      </header>

      <div class="overlay" id="overlay">
        <h1 class="overlay-title" id="overlay-title">TunnelWarp</h1>
        <p class="overlay-body" id="overlay-body">Loading&hellip;</p>
        <p class="overlay-badge" id="overlay-badge" hidden></p>

        <dl class="overlay-stats" id="overlay-stats" hidden>
          <div class="overlay-stat">
            <dt class="overlay-stat-label">Rings</dt>
            <dd class="overlay-stat-value" id="stat-rings">0</dd>
          </div>
          <div class="overlay-stat">
            <dt class="overlay-stat-label">Score</dt>
            <dd class="overlay-stat-value" id="stat-score">0</dd>
          </div>
          <div class="overlay-stat">
            <dt class="overlay-stat-label">Energy</dt>
            <dd class="overlay-stat-value" id="stat-energy">0</dd>
          </div>
          <div class="overlay-stat">
            <dt class="overlay-stat-label">Best rings</dt>
            <dd class="overlay-stat-value" id="stat-best">0</dd>
          </div>
        </dl>

        <p class="overlay-reward" id="overlay-reward" hidden></p>
        <p class="overlay-hint" id="overlay-hint"></p>
      </div>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
